<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gradBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradPillar" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#gradBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#4338ca" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Academic Vault / Classic Temple Silhouette -->
  <!-- Pediment / Roof Triangle -->
  <path d="M32 12 L14 23 H50 Z" fill="url(#gradPillar)" filter="url(#glow)"/>
  
  <!-- Architrave Beam -->
  <rect x="16" y="24" width="32" height="3" rx="1" fill="#ede9fe"/>
  
  <!-- Columns -->
  <rect x="18" y="29" width="4" height="17" rx="1.5" fill="url(#gradPillar)"/>
  <rect x="26" y="29" width="4" height="17" rx="1.5" fill="url(#gradPillar)"/>
  <rect x="34" y="29" width="4" height="17" rx="1.5" fill="url(#gradPillar)"/>
  <rect x="42" y="29" width="4" height="17" rx="1.5" fill="url(#gradPillar)"/>

  <!-- Base Plinth -->
  <rect x="14" y="47" width="36" height="3" rx="1" fill="#ede9fe"/>
  <rect x="11" y="51" width="42" height="3.5" rx="1.5" fill="url(#gradPillar)"/>

  <!-- Central Cognitive Spark (Psychopedagogy Psi Node) -->
  <circle cx="32" cy="19" r="2" fill="#38bdf8"/>
</svg>